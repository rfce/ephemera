<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Track Pixels | Track emails privately</title>
  <meta name="description" content="Track emails without giving inbox access. Fast, private, zero integrations." />

  <meta property="og:title" content="Email Tracker" />
  <meta property="og:description" content="Track emails privately" />
  <meta property="og:type" content="website" />

  <base href="/" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <style>
    #initial-page-placeholder {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #fff;
    }

    #initial-page-placeholder span {
      color: transparent;
      background:
        radial-gradient(circle at 18% 22%, #d85f67 0 13%, transparent 38%),
        radial-gradient(circle at 82% 24%, #f3b56f 0 14%, transparent 40%),
        radial-gradient(circle at 72% 82%, #8e6ab2 0 15%, transparent 42%),
        radial-gradient(circle at 24% 76%, #62a29d 0 14%, transparent 40%),
        linear-gradient(115deg, #dd6d6c 0%, #f19a82 48%, #a56db4 100%);
      background-size: 220% 220%, 240% 240%, 210% 210%, 235% 235%, 100% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: initial-mesh-gradient 5.5s ease-in-out infinite;
      font: 700 clamp(2.75rem, 8vw, 6.5rem) / 1 Roboto, sans-serif;
      letter-spacing: -0.07em;
    }

    @keyframes initial-mesh-gradient {
      0%, 100% { background-position: 0% 0%, 100% 10%, 80% 100%, 15% 85%, 50% 50%; }
      50% { background-position: 95% 55%, 12% 90%, 5% 18%, 92% 10%, 50% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      #initial-page-placeholder span { animation: none; }
    }
  </style>

</head>

<body>
  <div id="root">
    <div id="initial-page-placeholder" aria-live="polite"><span>Track Pixels</span></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
